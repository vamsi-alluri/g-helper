name: Sync upstream

on:
  schedule:
    # 05:30 UTC daily. Cron in Actions is best-effort and can run late.
    - cron: '30 5 * * *'
  workflow_dispatch:

# Two overlapping runs would both check out the same pre-merge base, both
# merge, and both race to push main. The loser dies on a rejected
# non-fast-forward push and reports nothing. Queue instead of racing.
concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: windows-2022
    outputs:
      # One step decides, because the decision no longer depends on whether
      # this run merged anything: upstream can promote a release on a day the
      # fork merged nothing, and a tag left unpublished by an earlier run has
      # to be picked up on a later one.
      released: ${{ steps.decide.outputs.released }}
      version: ${{ steps.decide.outputs.version }}
      ref: ${{ steps.decide.outputs.ref }}
    steps:
    - uses: actions/checkout@v7
      with:
        # Required: a shallow clone makes the behind-count below read 0, which
        # exits green and releases nothing, forever.
        fetch-depth: 0

    - name: Fetch upstream
      shell: bash
      run: |
        git remote add upstream https://github.com/seerge/g-helper || true
        git remote set-url upstream https://github.com/seerge/g-helper
        git fetch upstream main

    - name: Check for new upstream commits
      id: check
      shell: bash
      run: |
        # On a shallow clone the behind-count reads 0, so the merge, the build
        # gate and the push are all skipped and the run goes green having
        # silently stopped syncing main. That failure is invisible, so assert
        # loudly instead. The release decision no longer counts commits, so
        # this guard is the only thing standing between a shallow checkout and
        # a fork that quietly stops tracking upstream.
        if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
          echo "shallow checkout; this workflow needs fetch-depth: 0" >&2
          exit 1
        fi
        behind="$(git rev-list --count HEAD..upstream/main)"
        echo "behind=$behind" >> "$GITHUB_OUTPUT"
        echo "main is $behind commits behind upstream/main"

    - name: Merge upstream
      id: merge
      if: steps.check.outputs.behind != '0'
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if git merge --no-edit upstream/main; then
          echo "conflict=false" >> "$GITHUB_OUTPUT"
        else
          git merge --abort
          echo "conflict=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup dotnet
      if: steps.merge.outputs.conflict == 'false'
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Build gate
      id: build
      if: steps.merge.outputs.conflict == 'false'
      continue-on-error: true
      # Must match what release-fork.yml actually publishes. A Debug, RID-less
      # `dotnet build` can pass while the Release single-file publish fails,
      # which would push main and the tag and only then fail to release.
      shell: pwsh
      run: |
        dotnet publish app/GHelper.sln --configuration Release --runtime win-x64 -p:PublishSingleFile=true --no-self-contained
        if ($LASTEXITCODE -ne 0) { throw "release-configuration publish failed with $LASTEXITCODE" }

    - name: Report conflict or build failure
      if: steps.merge.outputs.conflict == 'true' || steps.build.outcome == 'failure'
      env:
        GH_TOKEN: ${{ github.token }}
        # Required: the `upstream` remote added above makes gh prefer
        # seerge/g-helper as the base repo, so without this pin every gh call
        # here targets upstream instead of this fork.
        GH_REPO: ${{ github.repository }}
      shell: bash
      run: |
        run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        if [ "${{ steps.merge.outputs.conflict }}" = "true" ]; then
          title="Upstream sync blocked: merge conflict"
          body="\`git merge upstream/main\` conflicted and was aborted. Nothing was pushed. Merge locally, resolve, push, then re-run this workflow."
        else
          title="Upstream sync blocked: build failure"
          body="\`upstream/main\` merged cleanly but the release-configuration publish failed, so the merge was not pushed. See the run log."
        fi

        # The run summary is the notification that always works. Issues can be
        # disabled on a fork, so the issue path below is a bonus, not the
        # mechanism we rely on.
        {
          echo "## $title"
          echo
          echo "$body"
          echo
          echo "Run: $run_url"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "$title"
        echo "$body"

        # Dedup: one open issue at a time, or a diverged upstream produces an
        # identical issue every single day.
        if existing="$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number' 2>/dev/null)"; then
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still blocked as of $(date -u +%Y-%m-%dT%H:%MZ). Run: $run_url" || true
          else
            gh label create upstream-sync --description "Automated upstream sync needs attention" --color B60205 2>/dev/null || true
            printf '%s\n\nRun: %s\n' "$body" "$run_url" > issue-body.txt
            gh issue create --title "$title" --label upstream-sync --body-file issue-body.txt || true
            rm -f issue-body.txt
          fi
        else
          echo "note: cannot read issues on ${{ github.repository }} (Issues may be disabled on this fork); reported via the run summary and this failure instead" >&2
        fi
        exit 1

    - name: Push main
      id: push
      if: steps.merge.outputs.conflict == 'false' && steps.build.outcome == 'success'
      shell: bash
      run: |
        # Unconditional once the merge built: main absorbs upstream every day
        # whether or not a release is due. Only the binary waits for upstream.
        git push origin HEAD:main

    - name: Decide whether to release, and tag
      id: decide
      # Deliberately `!=` rather than `==`: on a day with no new upstream
      # commits the merge and build steps are skipped, so `conflict` is the
      # empty string and `build.outcome` is 'skipped'. Testing for success
      # would skip the decision on exactly those days -- and upstream
      # promoting a release is independent of whether the fork merged
      # anything, so those are the days this most needs to run.
      if: steps.merge.outputs.conflict != 'true' && steps.build.outcome != 'failure'
      env:
        GH_TOKEN: ${{ github.token }}
        # Required: the `upstream` remote added above makes gh prefer
        # seerge/g-helper as the base repo, so without this pin gh would read
        # upstream's releases where this fork's are meant.
        GH_REPO: ${{ github.repository }}
        FORK_REPO: ${{ github.repository }}
      shell: bash
      run: |
        # Exit 3 means no release is due, which is the normal outcome on most
        # days: upstream flags most of its releases as prereleases and
        # promotes one roughly every one to two weeks. Any other non-zero
        # exit is a real fault and must stay red -- treating every refusal as
        # a quiet day would let a broken lookup stop the fork releasing with
        # nothing but green runs to show for it. The reason is on stderr.
        rc=0
        version="$(bash .github/scripts/fork-version.sh)" || rc=$?
        if [ "$rc" -eq 3 ]; then
          echo "released=false" >> "$GITHUB_OUTPUT"
          {
            echo "## No release this run"
            echo
            echo "No new upstream stable release. main is still being kept in sync."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        if [ "$rc" -ne 0 ]; then
          echo "fork-version.sh failed with exit $rc; see the message above" >&2
          exit "$rc"
        fi
        echo "derived version: $version"

        # A tag that already exists here was pushed by an earlier run whose
        # release never published -- had it published, it would have become
        # this fork's releases/latest and fork-version.sh would have refused
        # above. Reuse it rather than stepping past it, which would orphan the
        # tag and leave a permanent gap in the version line. This also covers
        # a tag created out of band, e.g. by hand during testing.
        if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
          echo "tag v$version already exists with no release; reusing it"
        else
          git tag "v$version"
          git push origin "v$version"
        fi
        echo "released=true" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "ref=v$version" >> "$GITHUB_OUTPUT"

    - name: Report any other failure
      if: failure()
      shell: bash
      run: |
        # The conflict/build report above only fires for those two causes. A
        # failed fetch, a rejected push, a shallow checkout or a refused
        # version derivation would otherwise leave nothing but a red run.
        run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        {
          echo "## Upstream sync failed"
          echo
          echo "The run failed outside the conflict and build-gate paths — check which step is red."
          echo
          echo "Run: $run_url"
        } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: sync
    if: needs.sync.outputs.released == 'true'
    uses: ./.github/workflows/release-fork.yml
    with:
      version: ${{ needs.sync.outputs.version }}
      ref: ${{ needs.sync.outputs.ref }}
    permissions:
      contents: write

  report-release-failure:
    # The sync job's own failure reporting cannot see this: the release runs
    # in a called workflow, so a publish that fails after the tag was pushed
    # would otherwise be nothing but a red run nobody is watching. It is not
    # self-healing silently either -- the tag now exists with no release, so
    # the next run reuses it and retries, which is only useful if someone
    # knows it is happening.
    needs: [sync, release]
    if: always() && needs.release.result == 'failure'
    runs-on: ubuntu-latest
    steps:
    - name: Report the failed release to the run summary
      shell: bash
      run: |
        run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        {
          echo "## Release failed after tagging"
          echo
          echo "Tag \`${{ needs.sync.outputs.ref }}\` was pushed but publishing \`${{ needs.sync.outputs.version }}\` failed."
          echo "The next scheduled run will reuse that tag and retry. If it keeps failing, check the release job log."
          echo
          echo "Run: $run_url"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "release of ${{ needs.sync.outputs.version }} failed; tag ${{ needs.sync.outputs.ref }} is unpublished"
        exit 1

  close-issue:
    # Separate job so the tracking issue is only closed once the release has
    # actually published. Closing it inside the sync job closed it while the
    # release job could still fail.
    needs: [sync, release]
    if: always() && needs.sync.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - name: Close the sync issue now that the pipeline is healthy
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      shell: bash
      run: |
        # Tolerant by design: Issues may be disabled on this fork, and a
        # healthy sync must never fail because housekeeping could not run.
        if existing="$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number' 2>/dev/null)"; then
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Upstream sync succeeded in run ${{ github.run_id }}." || true
          fi
        fi
